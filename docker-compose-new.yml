# ============================================================
#  3hang.asia 全服务 docker-compose.yml
#  放到 /opt/services/ 目录下统一管理
#  启动：docker compose up -d
#  停止：docker compose down
# ============================================================

services:

  # ── 反向代理 + 自动 HTTPS ──────────────────────────────
  # ── 3hmind 自我成长智能体 ────────────────────────────
  3hmind:
    image: 3hmind:latest
    container_name: 3hmind
    restart: unless-stopped
    env_file:
      - ../3hmind/.env
    volumes:
      - ../3hmind/data:/app/data
    networks:
      - web

# ── 共享网络（Caddy 通过容器名转发请求）──────────────────
networks:
  web:
    driver: bridge

# ── 持久化数据卷 ────────────────────────────────────────
volumes:
  caddy_data:
  caddy_config:
