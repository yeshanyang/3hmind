# ============================================================
#  3hang.asia 全服务 docker-compose.yml
#  放到 /opt/services/ 目录下统一管理
#  启动：docker compose up -d
#  停止：docker compose down
# ============================================================

services:

  # ── 反向代理 + 自动 HTTPS ──────────────────────────────
  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile        # 域名路由配置
      - caddy_data:/data                         # 证书持久化
      - caddy_config:/config
    networks:
      - web

  # ── 个人简介静态网站 ────────────────────────────────────
  portfolio:
    image: nginx:alpine
    container_name: portfolio
    restart: unless-stopped
    volumes:
      - ./portfolio/site:/usr/share/nginx/html:ro  # 把 index.html 放这里
    networks:
      - web

  # ── Vaultwarden 密码管理 ────────────────────────────────
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - SIGNUPS_ALLOWED=false          # 禁止公开注册
      - ADMIN_TOKEN=BqsE7ORb  # 管理后台 /admin 的密码
    volumes:
      - ./vaultwarden/data:/data
    networks:
      - web

  # ── Memos 笔记 ──────────────────────────────────────────
  memos:
    image: neosmemo/memos:stable
    container_name: memos
    restart: unless-stopped
    volumes:
      - ./memos/data:/var/opt/memos
    networks:
      - web

  # ── Uptime Kuma 监控 ────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./uptime-kuma/data:/app/data
    networks:
      - web

  # ── Alist 文件管理 ──────────────────────────────────────
  alist:
    image: xhofe/alist:latest
    container_name: alist
    restart: unless-stopped
    volumes:
      - ./alist/data:/opt/alist/data
    networks:
      - web

  # ── 3hmind 自我成长智能体 ────────────────────────────
  3hmind:
    image: 3hmind:latest
    container_name: 3hmind
    restart: unless-stopped
    env_file:
      - ../3hmind/.env
    volumes:
      - ../3hmind/data:/app/data
    networks:
      - web

# ── 共享网络（Caddy 通过容器名转发请求）──────────────────
networks:
  web:
    driver: bridge

# ── 持久化数据卷 ────────────────────────────────────────
volumes:
  caddy_data:
  caddy_config:
